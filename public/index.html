<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브레인롯 훔치기 온라인</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="auth-screen" class="screen">
  <div class="box">
    <h1>🧠 브레인롯 <span>훔치기</span></h1>
    <p class="sub">벨트에서 줍고 · 기지에 모으고 · 남의 것 훔치기!</p>
    <div class="tabs"><button id="tab-login" class="tab active">로그인</button><button id="tab-register" class="tab">회원가입</button></div>
    <div id="login-form">
      <input id="login-id" placeholder="아이디"><input id="login-pw" type="password" placeholder="비밀번호">
      <button id="btn-login" class="primary">로그인</button>
    </div>
    <div id="register-form" class="hidden">
      <input id="reg-id" placeholder="아이디 (3자 이상)"><input id="reg-nick" placeholder="닉네임">
      <input id="reg-pw" type="password" placeholder="비밀번호 (4자 이상)">
      <button id="btn-register" class="primary">회원가입</button>
    </div>
    <p id="auth-msg" class="msg"></p>
  </div>
</div>
<div id="game-screen" class="screen hidden">
  <canvas id="game-canvas"></canvas>
  <div id="hud">
    <div id="crosshair">·</div>
    <div id="topbar"><div id="cash">💵 $0</div><div id="income">+$0/초</div></div>
    <div id="killfeed"></div>
    <div id="bottom-left"><div id="carry">🤲 빈 손</div><div id="baselock">🔓 기지 열림</div></div>
    <div id="bottom-right"><div id="mybase">🏠 내 기지</div><div id="slots"></div></div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="chat"><div id="chat-log"></div><input id="chat-input" placeholder="Enter 채팅..." class="hidden"></div>
    <div id="interact-tip" class="hidden">E</div>
    <div id="locktip" class="hidden"></div>
  </div>
  <div id="click-to-play"><h2>클릭하여 입장</h2><p>WASD 이동 · 클릭 찰싹 · E 줍기/보관/잠금 · Q 내려놓기</p><button id="btn-leave">나가기</button></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
